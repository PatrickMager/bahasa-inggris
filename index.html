<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Portfolio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            border-radius: 10px;
        }

        /* Background Pattern */
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Pop-up Entrance Animation */
        @keyframes popUp {
            0% { opacity: 0; transform: translateY(25px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-popup {
            opacity: 0;
            animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Skeleton Shimmer Animation */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Bento Card Styling */
        .bento-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            height: 100%;
        }
        .bento-card:hover {
            border-color: #14b8a6;
            box-shadow: 0 10px 25px -5px rgb(20 184 166 / 0.15);
            transform: translateY(-4px);
        }
    </style>

    <script>
        const PORTFOLIO_DATA = {
            profil: {
                namaLengkap: "Febrian Alfarizzi",
                nim: "25090520047",
                jurusan: "Electrical Engineering",
                idFotoDrive: "1i_89zMAeuGpxwR6y1sNIrz5gxy1qZsBZ",
                deskripsi: "Passionate Electrical Engineering student bridging the gap between technical systems and clear professional communication through modern tools and collaborative projects.",
                deskripsiAlignment: "text-justify",
                email: "febrianalfarizzi29@gmail.com",
                linkLinkedIn: "https://linkedin.com/in/yourprofile",
                linkInstagram: "https://instagram.com/_Albriann_"
            },
            
            skills: [
                "Technical Documentation (Word)", 
                "Data Processing & Analysis (Excel)", 
                "Professional Presentations (PowerPoint)", 
                "IoT & Arduino"
            ],

            tugas: [
                {
                    judul: "English Roleplay Video",
                    deskripsi: "A conversational English video demonstrating a professional workplace scenario, discussing engineering project updates.",
                    deskripsiAlignment: "text-justify",
                    kategoriIkon: "video",
                    iconDriveId: "",
                    teksTombol: "Watch Video",
                    linkTugas: "https://drive.google.com"
                },
                {
                    judul: "Technical English Essay",
                    deskripsi: "An academic essay detailing the transition to renewable energy systems, emphasizing proper English grammar and structure.",
                    deskripsiAlignment: "text-justify",
                    kategoriIkon: "dokumen",
                    iconDriveId: "",
                    teksTombol: "Read Essay",
                    linkTugas: "https://docs.google.com/document"
                },
                {
                    judul: "Project Pitch Presentation",
                    deskripsi: "A slide deck and video recording of an English pitch presentation proposing a smart home IoT system.",
                    deskripsiAlignment: "text-justify",
                    kategoriIkon: "presentasi",
                    iconDriveId: "",
                    teksTombol: "View Slides",
                    linkTugas: "https://docs.google.com/presentation"
                }
            ]
        };
    </script>
</head>

<body class="text-slate-800 antialiased min-h-screen py-6 md:py-8 px-4 sm:px-8 lg:px-12 flex flex-col justify-between">

    <main class="max-w-7xl mx-auto space-y-6 w-full">
        
        <!-- HEADER GRID -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- PROFILE CARD (Skeleton initially, replaced on load) -->
            <div id="skeleton-profile" class="bento-card md:col-span-2 p-6 md:p-8 flex flex-col sm:flex-row items-center sm:items-start gap-6">
                <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full skeleton-shimmer flex-shrink-0"></div>
                <div class="flex-1 space-y-3 w-full mt-2">
                    <div class="h-6 w-40 rounded-full skeleton-shimmer"></div>
                    <div class="h-8 w-3/4 rounded-lg skeleton-shimmer"></div>
                    <div class="space-y-2">
                        <div class="h-4 w-full rounded skeleton-shimmer"></div>
                        <div class="h-4 w-5/6 rounded skeleton-shimmer"></div>
                    </div>
                </div>
            </div>

            <!-- PROFILE CARD REAL (Hidden initially) -->
            <div id="real-profile" class="bento-card md:col-span-2 p-6 md:p-8 flex flex-col sm:flex-row items-center sm:items-start gap-6 animate-popup hidden" style="animation-delay: 50ms;">
                <div class="relative w-28 h-28 sm:w-32 sm:h-32 flex-shrink-0">
                    <div class="absolute inset-0 bg-brand-500 rounded-full blur-md opacity-30"></div>
                    <img id="render-foto" src="" alt="Profile Picture" class="relative w-full h-full object-cover rounded-full border-2 border-white shadow-lg bg-slate-100">
                </div>
                
                <div class="text-center sm:text-left flex-1 mt-2 sm:mt-0">
                    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-50 text-brand-600 text-xs font-semibold tracking-wide border border-brand-100 mb-3">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-500 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-600"></span>
                        </span>
                        <span id="render-jurusan-nim"></span>
                    </div>
                    <h1 class="font-display text-2xl sm:text-4xl font-bold text-slate-900 mb-3">
                        Hello, I'm <span class="text-brand-600" id="render-nama"></span>
                    </h1>
                    <p id="render-deskripsi" class="text-slate-600 leading-relaxed text-sm sm:text-base"></p>
                </div>
            </div>

            <!-- CONNECT CARD -->
            <div class="bento-card p-6 flex flex-col justify-center animate-popup" style="animation-delay: 150ms">
                <h2 class="font-display font-bold text-lg text-slate-900 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                    Let's Connect
                </h2>
                <div class="space-y-3">
                    <a id="render-email" href="#" class="flex items-center gap-3 text-slate-600 hover:text-brand-600 transition-colors group cursor-pointer">
                        <div class="p-2 bg-slate-100 rounded-lg group-hover:bg-brand-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                        </div>
                        <span class="text-sm font-medium">Email Me</span>
                    </a>
                    <a id="render-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 text-slate-600 hover:text-brand-600 transition-colors group">
                        <div class="p-2 bg-slate-100 rounded-lg group-hover:bg-brand-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                        </div>
                        <span class="text-sm font-medium">LinkedIn Profile</span>
                    </a>
                    <a id="render-instagram" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 text-slate-600 hover:text-brand-600 transition-colors group">
                        <div class="p-2 bg-slate-100 rounded-lg group-hover:bg-brand-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                        </div>
                        <span class="text-sm font-medium">Instagram Profile</span>
                    </a>
                </div>
            </div>

            <!-- SKILLS CARD -->
            <div class="bento-card md:col-span-3 p-6 sm:p-8 animate-popup" style="animation-delay: 250ms">
                <h2 class="font-display font-bold text-xl text-slate-900 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                    Skills & Competencies
                </h2>
                <div id="render-skills" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- ASSIGNMENTS SECTION -->
        <div>
            <div class="flex items-center gap-3 mb-6 mt-6 animate-popup" style="animation-delay: 350ms">
                <div class="h-8 w-1.5 bg-brand-500 rounded-full"></div>
                <h2 class="font-display font-bold text-2xl text-slate-900">English Assignments</h2>
            </div>
            
            <div id="render-tugas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <!-- COMPACT FOOTER -->
    <footer class="mt-8 border-t border-slate-200/80 pt-4 pb-4 text-center text-slate-500 text-sm font-medium animate-popup max-w-7xl mx-auto w-full" style="animation-delay: 450ms">
        <p>&copy; 2026 English Portfolio.</p>
    </footer>

    <!-- EMAIL COPY TOAST NOTIFICATION -->
    <div id="email-toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-sm shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        <span id="toast-text">Email copied to clipboard!</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = PORTFOLIO_DATA;

            // Render Profil
            document.getElementById('render-nama').textContent = data.profil.namaLengkap;
            document.getElementById('render-jurusan-nim').textContent = `${data.profil.jurusan} | NIM: ${data.profil.nim}`;
            
            const descEl = document.getElementById('render-deskripsi');
            descEl.textContent = data.profil.deskripsi;
            const profileAlign = data.profil.deskripsiAlignment || "text-justify";
            descEl.className = `text-slate-600 leading-relaxed text-sm sm:text-base ${profileAlign}`;
            
            // Swap skeleton profile with real profile smoothly
            document.getElementById('skeleton-profile').classList.add('hidden');
            document.getElementById('real-profile').classList.remove('hidden');

            // Email Click Handler: Mailto + Clipboard fallback for iframe environments
            const emailEl = document.getElementById('render-email');
            const toastEl = document.getElementById('email-toast');
            const toastText = document.getElementById('toast-text');

            emailEl.addEventListener('click', (e) => {
                e.preventDefault();
                const email = data.profil.email;
                
                try {
                    window.location.href = `mailto:${email}`;
                } catch (err) {}

                navigator.clipboard.writeText(email).then(() => {
                    toastText.textContent = `Email (${email}) copied!`;
                    toastEl.classList.remove('translate-y-20', 'opacity-0');
                    setTimeout(() => {
                        toastEl.classList.add('translate-y-20', 'opacity-0');
                    }, 3000);
                }).catch(() => {
                    window.open(`mailto:${email}`);
                });
            });
            
            document.getElementById('render-linkedin').href = data.profil.linkLinkedIn;
            document.getElementById('render-instagram').href = data.profil.linkInstagram;

            // Render Foto Profil
            const imgEl = document.getElementById('render-foto');
            if (data.profil.idFotoDrive && data.profil.idFotoDrive.trim() !== "") {
                imgEl.src = `https://lh3.googleusercontent.com/d/${data.profil.idFotoDrive.trim()}`;
            } else {
                imgEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.profil.namaLengkap)}&background=0f172a&color=14b8a6&size=256`;
            }

            // Render Skills
            const skillsContainer = document.getElementById('render-skills');
            data.skills.forEach((skill, index) => {
                const isHighlight = index === data.skills.length - 1; 
                const styling = isHighlight 
                    ? "bg-brand-50 text-brand-700 border-brand-200" 
                    : "bg-slate-100 text-slate-700 border-slate-200";
                
                skillsContainer.insertAdjacentHTML('beforeend', 
                    `<span class="px-4 py-1.5 text-sm font-medium rounded-lg border ${styling}">${skill}</span>`
                );
            });

            // Render Tugas with Pop-up stagger
            const tugasContainer = document.getElementById('render-tugas');
            
            const icons = {
                video: {
                    colorConfig: { bg: 'bg-blue-50', text: 'text-blue-600', hoverBg: 'group-hover:bg-blue-600' },
                    svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>`
                },
                dokumen: {
                    colorConfig: { bg: 'bg-purple-50', text: 'text-purple-600', hoverBg: 'group-hover:bg-purple-600' },
                    svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>`
                },
                presentasi: {
                    colorConfig: { bg: 'bg-orange-50', text: 'text-orange-600', hoverBg: 'group-hover:bg-orange-600' },
                    svg: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>`
                }
            };

            data.tugas.forEach((tugas, index) => {
                const categoryData = icons[tugas.kategoriIkon] || icons.video; 
                const c = categoryData.colorConfig;
                
                let iconDisplay = categoryData.svg;
                if (tugas.iconDriveId && tugas.iconDriveId.trim() !== "") {
                    iconDisplay = `<img src="https://lh3.googleusercontent.com/d/${tugas.iconDriveId.trim()}" alt="Task Logo" class="w-full h-full object-cover rounded-xl" onerror="this.onerror=null; this.replaceWith(document.createTextNode('📁'));">`;
                }

                const taskAlign = tugas.deskripsiAlignment || "text-justify";
                const delayMs = 400 + (index * 80);
                
                const cardHtml = `
                    <div class="bento-card p-6 flex flex-col justify-between group animate-popup" style="animation-delay: ${delayMs}ms">
                        <div>
                            <div class="w-12 h-12 ${c.bg} ${c.text} rounded-xl flex items-center justify-center mb-4 overflow-hidden ${c.hoverBg} group-hover:text-white transition-colors duration-300">
                                ${iconDisplay}
                            </div>
                            <h3 class="font-bold text-xl text-slate-900 mb-2">${tugas.judul}</h3>
                            <p class="text-slate-600 text-sm mb-6 leading-relaxed ${taskAlign}">${tugas.deskripsi}</p>
                        </div>
                        <a href="${tugas.linkTugas}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-between w-full px-4 py-3 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl font-medium text-sm group-hover:bg-brand-50 group-hover:border-brand-300 group-hover:text-brand-700 transition-colors">
                            <span>${tugas.teksTombol}</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                        </a>
                    </div>
                `;
                tugasContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        });
    </script>
</body>
</html>
